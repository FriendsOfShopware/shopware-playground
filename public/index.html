<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopware Playground</title>
    <style>
      :root {
        --brand: #189eff;
        --brand-dark: #0e7cd6;
        --ink: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      #app { display: contents; }

      #bar {
        display: flex; align-items: center; gap: 0.75rem;
        padding: 0.45rem 0.9rem; background: var(--brand); color: #fff;
        flex: 0 0 auto;
      }
      #bar strong { font-size: 0.95rem; white-space: nowrap; }
      #bar .spacer { flex: 1; }
      #status { font-size: 0.8rem; opacity: 0.9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34vw; }
      #bar select, #bar button {
        font: inherit; font-size: 0.82rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.45);
        background: rgba(255,255,255,0.14); color: #fff; padding: 0.28rem 0.6rem; cursor: pointer;
      }
      #bar select option { color: var(--ink); }
      #bar button:hover, #bar select:hover { background: rgba(255,255,255,0.28); }
      #bar button:disabled { opacity: 0.5; cursor: default; }

      #main { flex: 1; display: flex; min-height: 0; }
      #viewport { border: 0; flex: 1; background: #fff; min-width: 0; }

      /* browser chrome (bottom address bar) */
      #chrome {
        flex: 0 0 auto; display: flex; align-items: center; gap: 0.45rem;
        padding: 0.45rem 0.8rem; background: #f1f5f9; border-top: 1px solid var(--line);
      }
      #chrome .navbtn {
        width: 2rem; height: 2rem; border: 0; border-radius: 50%; background: none;
        color: #475569; font-size: 1.05rem; cursor: pointer; display: inline-flex;
        align-items: center; justify-content: center; flex: 0 0 auto;
      }
      #chrome .navbtn:hover { background: #e2e8f0; color: var(--ink); }
      #chrome .navbtn:disabled { opacity: 0.35; cursor: default; background: none; }
      #addrwrap { position: relative; flex: 1; min-width: 0; }
      #addr {
        width: 100%; height: 2.1rem; border: 1px solid var(--line); border-radius: 999px;
        background: #fff; color: var(--ink); padding: 0 2.2rem 0 1rem;
        font-family: ui-monospace, monospace; font-size: 0.82rem; outline: none;
      }
      #addr:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(24,158,255,0.18); }
      #addrgo {
        position: absolute; right: 0.3rem; top: 50%; transform: translateY(-50%);
        border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 0.95rem;
        width: 1.7rem; height: 1.7rem; border-radius: 50%;
      }
      #addrgo:hover { background: #e2e8f0; color: var(--brand); }
      #quicknav {
        position: absolute; left: 0; right: 0; bottom: calc(100% + 6px);
        background: #fff; border: 1px solid var(--line); border-radius: 10px;
        box-shadow: 0 10px 30px rgba(15,23,42,0.18); padding: 0.3rem; z-index: 30;
      }
      #quicknav[hidden] { display: none; }
      #quicknav .qn {
        display: flex; align-items: center; gap: 0.6rem; width: 100%; text-align: left;
        border: 0; background: none; padding: 0.45rem 0.6rem; border-radius: 7px;
        font-size: 0.84rem; color: var(--ink); cursor: pointer;
      }
      #quicknav .qn:hover, #quicknav .qn.active { background: #eff6ff; }
      #quicknav .qn .qn-icon { width: 1.1rem; text-align: center; }
      #quicknav .qn .qn-path { color: var(--muted); font-family: ui-monospace, monospace; font-size: 0.74rem; margin-left: auto; }

      /* drawer (Database / Files / Logs) */
      #console {
        flex: 0 0 560px; max-width: 92vw; display: none; flex-direction: column;
        background: var(--ink); color: #e2e8f0; border-left: 1px solid var(--line);
      }
      #console.open { display: flex; }
      #console header {
        display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.8rem;
        border-bottom: 1px solid #1e293b; font-size: 0.85rem;
      }
      #console header .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
      #console header .spacer { flex: 1; }
      #console header button { background: none; border: 0; color: #94a3b8; font-size: 1rem; cursor: pointer; }
      #tabs { display: flex; gap: 0.25rem; }
      #tabs button {
        font-size: 0.8rem !important; padding: 0.25rem 0.7rem; border-radius: 6px;
        color: #94a3b8;
      }
      #tabs button.active { background: #1e293b; color: #e2e8f0; }
      .panel { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
      .panel[hidden] { display: none; }

      /* SQL tab */
      #tables {
        padding: 0.4rem 0.8rem; border-bottom: 1px solid #1e293b; font-size: 0.75rem;
        max-height: 110px; overflow: auto; display: flex; flex-wrap: wrap; gap: 0.3rem;
      }
      #tables span {
        background: #1e293b; border-radius: 4px; padding: 0.1rem 0.45rem; cursor: pointer;
        color: #7dd3fc;
      }
      #tables span:hover { background: #334155; }
      #sql {
        margin: 0.6rem 0.8rem 0; min-height: 90px; resize: vertical;
        background: #020617; color: #a5f3fc; border: 1px solid #1e293b; border-radius: 6px;
        font-family: ui-monospace, monospace; font-size: 0.82rem; padding: 0.55rem;
      }
      #console .runrow { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.8rem; }
      #runsql, #fssave, #logs-refresh {
        background: var(--brand); border: 0; color: #fff; border-radius: 6px;
        padding: 0.32rem 0.9rem; font-size: 0.82rem; cursor: pointer;
      }
      #runsql:hover, #fssave:hover, #logs-refresh:hover { background: var(--brand-dark); }
      #fssave:disabled { opacity: 0.5; cursor: default; }
      #sqlmeta, #fsmeta, #logsmeta { font-size: 0.75rem; color: var(--muted); }
      #sqlout { flex: 1; overflow: auto; margin: 0 0.8rem 0.8rem; font-size: 0.78rem; }
      #sqlout table { border-collapse: collapse; width: 100%; }
      #sqlout th, #sqlout td {
        border: 1px solid #1e293b; padding: 0.22rem 0.5rem; text-align: left;
        max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      #sqlout th { background: #1e293b; position: sticky; top: 0; }
      #sqlout .err, #reqlog .err { color: #fca5a5; white-space: pre-wrap; font-family: ui-monospace, monospace; }
      #sqlout .ok { color: #86efac; }
      #sqlout td.null { color: #475569; font-style: italic; }
      #sqlout td.bin { color: #fbbf24; font-family: ui-monospace, monospace; }

      /* Files tab */
      #fscrumb {
        display: flex; align-items: center; flex-wrap: wrap; gap: 0.15rem;
        padding: 0.45rem 0.8rem; border-bottom: 1px solid #1e293b; font-size: 0.78rem;
      }
      #fscrumb a { color: #7dd3fc; cursor: pointer; text-decoration: none; }
      #fscrumb a:hover { text-decoration: underline; }
      #fscrumb .sep { color: #475569; }
      #fslist {
        max-height: 180px; overflow: auto; border-bottom: 1px solid #1e293b;
        font-size: 0.8rem; padding: 0.3rem 0;
      }
      #fslist .row {
        display: flex; gap: 0.5rem; padding: 0.16rem 0.8rem; cursor: pointer;
        color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #fslist .row:hover { background: #1e293b; }
      #fslist .row.dir { color: #7dd3fc; }
      #fslist .row .icon { width: 1rem; flex: 0 0 auto; opacity: 0.8; }
      #fseditorbar {
        display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0.8rem;
        font-size: 0.78rem; color: var(--muted);
      }
      #fseditorbar #fspath { color: #e2e8f0; font-family: ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #fseditor {
        flex: 1; margin: 0 0.8rem 0.8rem; resize: none;
        background: #020617; color: #e2e8f0; border: 1px solid #1e293b; border-radius: 6px;
        font-family: ui-monospace, monospace; font-size: 0.8rem; padding: 0.55rem;
        tab-size: 4;
      }
      #fseditor:disabled { opacity: 0.45; }

      /* Logs tab */
      #logs .runrow { border-bottom: 1px solid #1e293b; }
      #logfiles {
        display: flex; flex-wrap: wrap; gap: 0.3rem; padding: 0.4rem 0.8rem;
        border-bottom: 1px solid #1e293b; font-size: 0.75rem;
      }
      #logfiles span {
        background: #1e293b; border-radius: 4px; padding: 0.1rem 0.45rem; cursor: pointer;
        color: #7dd3fc;
      }
      #logfiles span.active { background: var(--brand); color: #fff; }
      #logtail {
        flex: 1; overflow: auto; margin: 0.5rem 0.8rem; padding: 0.5rem;
        background: #020617; border: 1px solid #1e293b; border-radius: 6px;
        font-family: ui-monospace, monospace; font-size: 0.72rem; white-space: pre-wrap;
        color: #a5b4fc; min-height: 80px; max-height: 34%;
      }
      #reqlog { flex: 1; overflow: auto; margin: 0 0.8rem 0.8rem; font-size: 0.75rem; }
      #reqlog table { border-collapse: collapse; width: 100%; }
      #reqlog th, #reqlog td {
        border: 1px solid #1e293b; padding: 0.2rem 0.45rem; text-align: left;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px;
      }
      #reqlog th { background: #1e293b; position: sticky; top: 0; }
      #reqlog td.st2 { color: #86efac; }
      #reqlog td.st3 { color: #7dd3fc; }
      #reqlog td.st4, #reqlog td.st5 { color: #fca5a5; }
      #reqlog tr.haserr td { cursor: pointer; }
      #reqlog tr.haserr:hover td { background: #1e293b; }
      #reqlog .errrow td { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.72rem; color: #fca5a5; }

      /* boot loading overlay */
      #bootoverlay {
        position: fixed; inset: 0; z-index: 100;
        background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(3px);
        display: flex; align-items: center; justify-content: center; padding: 1rem;
      }
      .bootcard {
        background: #fff; border-radius: 14px; box-shadow: 0 24px 60px rgba(15,23,42,0.35);
        padding: 1.8rem 2.1rem; max-width: 420px; width: 100%; text-align: center;
        color: var(--ink);
      }
      .bootcard h2 { margin: 0.9rem 0 0.3rem; font-size: 1.15rem; }
      .boot-spinner {
        width: 42px; height: 42px; margin: 0 auto; border-radius: 50%;
        border: 4px solid var(--line); border-top-color: var(--brand);
        animation: bootspin 0.9s linear infinite;
      }
      @keyframes bootspin { to { transform: rotate(360deg); } }
      .boot-status {
        margin: 0.2rem 0 0; font-size: 0.85rem; color: var(--muted);
        min-height: 1.2em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .boot-status.err { color: #dc2626; white-space: pre-wrap; }
      .boot-steps {
        list-style: none; margin: 1rem auto 0; padding: 0; text-align: left;
        font-size: 0.82rem; max-width: 260px;
      }
      .boot-steps li { padding: 0.18rem 0 0.18rem 1.5rem; position: relative; color: var(--muted); }
      .boot-steps li::before {
        content: ''; position: absolute; left: 0.15rem; top: 0.55rem;
        width: 8px; height: 8px; border-radius: 50%; background: var(--line);
      }
      .boot-steps li.active { color: var(--ink); font-weight: 600; }
      .boot-steps li.active::before { background: var(--brand); box-shadow: 0 0 0 3px rgba(24,158,255,0.25); }
      .boot-steps li.done { color: #16a34a; }
      .boot-steps li.done::before { background: #16a34a; }
      .boot-hint { font-size: 0.76rem; color: var(--muted); margin: 1rem 0 0; line-height: 1.45; }
      .boot-creds {
        margin-top: 1rem; padding-top: 0.9rem; border-top: 1px solid var(--line);
        display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; align-items: center;
      }
      .boot-creds-title { flex: 0 0 100%; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
      .boot-creds .cred {
        font: inherit; font-size: 0.78rem; border: 1px solid var(--line); border-radius: 999px;
        background: #f8fafc; color: var(--ink); padding: 0.25rem 0.7rem; cursor: pointer;
      }
      .boot-creds .cred:hover { border-color: var(--brand); background: #eff6ff; }
      .boot-creds .cred code { font-family: ui-monospace, monospace; font-weight: 600; }
      .boot-error-icon {
        width: 42px; height: 42px; margin: 0 auto; border-radius: 50%;
        background: #fee2e2; color: #dc2626; font-size: 1.5rem; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
      }
      .boot-retry {
        margin-top: 1rem; font: inherit; font-size: 0.85rem; border: 0; border-radius: 8px;
        background: var(--brand); color: #fff; padding: 0.45rem 1.2rem; cursor: pointer;
      }
      .boot-retry:hover { background: var(--brand-dark); }

      /* admin credentials modal */
      #adminmodal { position: fixed; inset: 0; z-index: 110; display: flex; align-items: center; justify-content: center; }
      .adminmodal-backdrop { position: absolute; inset: 0; background: rgba(15,23,42,0.45); }
      .adminmodal-card {
        position: relative; background: #fff; border-radius: 12px; width: 340px; max-width: 92vw;
        box-shadow: 0 20px 50px rgba(15,23,42,0.3); overflow: hidden;
      }
      .adminmodal-card header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 0.7rem 1rem; background: var(--brand); color: #fff; font-size: 0.9rem;
      }
      .adminmodal-card header button { background: none; border: 0; color: #fff; font-size: 1rem; cursor: pointer; opacity: 0.85; }
      .adminmodal-card header button:hover { opacity: 1; }
      .adminmodal-body { padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
      .credrow {
        display: flex; align-items: center; gap: 0.6rem;
        border: 1px solid var(--line); border-radius: 8px; padding: 0.45rem 0.7rem;
      }
      .credrow .credlabel { font-size: 0.75rem; color: var(--muted); width: 4.2rem; flex: 0 0 auto; }
      .credrow code { flex: 1; font-family: ui-monospace, monospace; font-size: 0.88rem; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
      .credrow button {
        font: inherit; font-size: 0.76rem; border: 1px solid var(--line); border-radius: 6px;
        background: #f8fafc; padding: 0.2rem 0.6rem; cursor: pointer; color: var(--ink);
      }
      .credrow button:hover { border-color: var(--brand); background: #eff6ff; }
      .openadmin {
        margin-top: 0.3rem; font: inherit; font-size: 0.86rem; border: 0; border-radius: 8px;
        background: var(--brand); color: #fff; padding: 0.5rem 1rem; cursor: pointer; text-align: center;
      }
      .openadmin:hover { background: var(--brand-dark); }
      .openadmin:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
